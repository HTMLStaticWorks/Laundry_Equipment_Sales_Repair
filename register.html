<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register B2B Account | Laundry Equipment Sales & Repair</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-container">
  <div style="position: absolute; top: 1.5rem; right: 2rem; display: flex; gap: 0.5rem; z-index: 10;">
    <button class="btn-icon theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme" style="background:var(--bg-surface); border:1px solid var(--border-color); color:var(--text-primary); cursor:pointer; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:all 0.3s ease;">
      <i data-lucide="moon" style="width:18px; height:18px;"></i>
    </button>
    <button class="btn-icon rtl-toggle-btn" title="Toggle LTR/RTL" aria-label="Toggle LTR/RTL" style="background:var(--bg-surface); border:1px solid var(--border-color); color:var(--text-primary); cursor:pointer; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:all 0.3s ease;">
      <i data-lucide="arrow-left-right" style="width:18px; height:18px;"></i>
    </button>
  </div>

  <div class="auth-card" style="max-width:480px;">
    <div style="text-align:center; margin-bottom:1.75rem;">
      <a href="index.html" class="brand-logo" style="justify-content:center;">
        <div class="brand-logo-icon">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
  <line x1="4" y1="7" x2="20" y2="7"></line>
  <circle cx="12" cy="14" r="4.5"></circle>
  <path d="M12 11a3 3 0 0 0-3 3"></path>
  <circle cx="7.5" cy="4.5" r="0.5" fill="currentColor"></circle>
  <circle cx="10" cy="4.5" r="0.5" fill="currentColor"></circle>
  <circle cx="16.5" cy="4.5" r="1.5"></circle>
</svg>
</div>
        <div class="brand-logo-text">INDUSTRIAL<span>LAUNDRY</span></div>
      </a>
      <p style="font-size:0.85rem; color:var(--text-secondary);">Create B2B Equipment & Maintenance Account</p>
    </div>

    <form onsubmit="event.preventDefault(); alert('Account registration request submitted'); window.location.href='login.html';">
      <div class="form-group">
        <label class="form-label" for="reg-name">Full Name</label>
        <input type="text" id="reg-name" class="form-input" placeholder="e.g. Sarah Jenkins" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Work Email</label>
        <input type="email" id="reg-email" class="form-input" placeholder="s.jenkins@hotelgroup.com" required>
      </div>

      <div style="display:flex; flex-direction:column; gap:1rem;">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" for="reg-pass">Password</label>
          <div style="position:relative; width:100%;">
            <input type="password" id="reg-pass" class="form-input" placeholder="••••••••" required style="padding-right:2.5rem;">
            <button type="button" onclick="const passInput=document.getElementById('reg-pass'); const passIcon=this.querySelector('i'); if(passInput.type==='password'){passInput.type='text';passIcon.setAttribute('data-lucide','eye-off');}else{passInput.type='password';passIcon.setAttribute('data-lucide','eye');} lucide.createIcons();" style="position:absolute; right:0.85rem; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-muted); padding:0; display:flex; align-items:center; justify-content:center;">
              <i data-lucide="eye" style="width:1.1rem; height:1.1rem;"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-cpass">Confirm Password</label>
          <div style="position:relative; width:100%;">
            <input type="password" id="reg-cpass" class="form-input" placeholder="••••••••" required style="padding-right:2.5rem;">
            <button type="button" onclick="const cpassInput=document.getElementById('reg-cpass'); const cpassIcon=this.querySelector('i'); if(cpassInput.type==='password'){cpassInput.type='text';cpassIcon.setAttribute('data-lucide','eye-off');}else{cpassInput.type='password';cpassIcon.setAttribute('data-lucide','eye');} lucide.createIcons();" style="position:absolute; right:0.85rem; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-muted); padding:0; display:flex; align-items:center; justify-content:center;">
              <i data-lucide="eye" style="width:1.1rem; height:1.1rem;"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="form-group" style="margin-bottom:1.5rem;">
        <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.8rem; color:#A0B2BA; cursor:pointer;">
          <input type="checkbox" required style="accent-color:var(--accent);">
          I agree to the Commercial Terms of Service & Privacy Policy
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-bottom:1.25rem;">
        <i data-lucide="user-plus"></i> Register B2B Account
      </button>

      <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.25rem;">
        <div style="flex:1; height:1px; background-color:var(--border-color);"></div>
        <span style="font-size:0.75rem; color:var(--text-muted);">OR REGISTER WITH</span>
        <div style="flex:1; height:1px; background-color:var(--border-color);"></div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.25rem;">
        <button type="button" class="btn btn-outline" style="font-size:0.8rem; padding:0.6rem; display:flex; align-items:center; justify-content:center; gap:0.5rem;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button type="button" class="btn btn-outline" style="font-size:0.8rem; padding:0.6rem; display:flex; align-items:center; justify-content:center; gap:0.5rem;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="16" height="16" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
          Apple ID
        </button>
      </div>
    </form>

    <div style="text-align:center; font-size:0.85rem; color:var(--text-secondary);">
      Already have an account? <a href="login.html" style="color:var(--accent); font-weight:600;">Sign In</a>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
